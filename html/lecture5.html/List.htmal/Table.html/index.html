<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        table,tr,td,th{
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <div>
       <h1>Tables</h1>
       <table>
         <tr>
        <td>1</td>
        <td>2</td>
       </tr>
       <tr>
        <td>3</td>
        <td>4</td>
       </tr>

       </table>

       <h2>Student Score</h2>
       <table>
        <thead>
             <tr>
            <th>Student/Subject</th>
            <th>Maths</th>
            <th>Hindi</th>
            <th>English</th>
            <th>Science</th>
        </tr>

        </thead>
        <tbody>
            <tr>
            <td>Anu</td>
            <td>90</td>
            <td>59</td>
            <td>70</td>
            <td>96</td>
        </tr>
        <tr>
            <td>pooja</td>
            <td>100</td>
            <td>99</td>
            <td>88</td>
            <td>77</td>
        </tr>
        <tr>
            <td>Asha</td>
            <td>50</td>
            <td>80</td>
            <td>89</td>
            <td>99</td>
        </tr>
        <tr>
            <td>Vaasu</td>
            <td>12</td>
            <td>13</td>
            <td>14</td>
            <td>15</td>
        </tr>

        </tbody>
         <caption>Student Score</caption>
      
       
        

       </table>

       <h2>Rowspan and colspan</h2>
       <table>
        <tr>
            <td rowspan="2"></td>
            <td colspan="2">Average</td>
            <td rowspan="2">Red eyes</td>
        </tr>
        <tr>
            
            <td>Height</td>
            <td>weight</td>
            
        </tr>
        <tr>
            <td>Males</td>
            <td>1.9</td>
            <td>0.03</td>
            <td>40%</td>
        </tr>
    <tr>
        <td>Females</td>
        <td>1.9</td>
        <td>0.003</td>
        <td>43%</td>
    </tr>
       </table>
      
    </div>
    
</body>
</html>
